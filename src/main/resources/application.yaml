spring:
  datasource:
    # MySQL 서버 주소 (localhost:3306) 및 데이터베이스 이름
    url: ${DB_URL:jdbc:mysql://localhost:3306/spatial_asset_db?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    # 실제 비밀번호는 DB_PASSWORD 환경 변수로 주입
    password: ${DB_PASSWORD:}
    # MySQL 드라이버 클래스 지정
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 클래스 변경 시 DB 테이블을 자동으로 업데이트 (개발 단계 추천)
      ddl-auto: update
    properties:
      hibernate:
        # 실행되는 SQL 쿼리를 콘솔창에 출력
        show_sql: true
        # 콘솔에 출력되는 SQL을 읽기 좋게 포맷팅
        format_sql: true
        # 엔티티의 camelCase 필드명을 DB의 snake_case 컬럼명으로 자동 변환
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}

app:
  webhook-url: ${APP_WEBHOOK_URL:http://localhost:8080/api/webhook}
  jwt:
    secret: ${JWT_SECRET}

outbox:
  # false로 실행하면 기존 afterCommit + subscribe 기준선을 재현합니다.
  enabled: ${OUTBOX_ENABLED:true}
  worker:
    enabled: ${OUTBOX_WORKER_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:4}
    max-concurrency: ${OUTBOX_MAX_CONCURRENCY:4}
    lease-ms: ${OUTBOX_LEASE_MS:30000}
    request-timeout-ms: ${OUTBOX_REQUEST_TIMEOUT_MS:10000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    base-backoff-ms: ${OUTBOX_BASE_BACKOFF_MS:1000}
